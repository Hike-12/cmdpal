version: 2

project_name: cmdpal

builds:
  - id: cmdpal
    binary: cmdpal
    main: .
    env:
      - CGO_ENABLED=0
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath

archives:
  - ids: [cmdpal]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256
